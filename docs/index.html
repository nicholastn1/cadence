<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadence</title>
<meta name="description" content="A teleprompter in your MacBook's notch that scrolls at the pace you speak.">
<link rel="icon" href="icon.png">
<style>
  :root { --ink: #F2F2EE; --muted: #9a9a96; --bg: #000; --tally: #FF4136; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 56px 16px 72px; text-align: center; }
  img.icon { width: 96px; height: 96px; }
  h1 { font-size: 44px; letter-spacing: -0.02em; margin: 12px 0 4px; }
  p.lede { color: var(--muted); font-size: 20px; margin: 0 0 32px; }
  video { width: 100%; border-radius: 14px; background: #111; display: block; }
  .install { margin: 32px auto 8px; display: inline-flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; background: #141414; max-width: 100%; }
  code { font: 15px/1.4 ui-monospace, Menlo, monospace; overflow-x: auto; white-space: nowrap; }
  button { font: inherit; font-size: 14px; color: var(--ink); background: #2a2a2a; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--tally); outline-offset: 2px; }
  a { color: var(--ink); }
  p.links { color: var(--muted); margin-top: 20px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="">
  <h1>Cadence</h1>
  <p class="lede">A teleprompter in your MacBook's notch that scrolls at the pace you speak.</p>
  <video src="guide.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
  <div class="install">
    <code id="cmd">brew install --cask nicholastn1/tap/cadence</code>
    <button type="button" onclick="navigator.clipboard.writeText(document.getElementById('cmd').textContent).then(() => { this.textContent = 'Copied'; })">Copy</button>
  </div>
  <p class="links">Free and open source. <a href="https://github.com/nicholastn1/cadence">Source on GitHub</a>, <a href="https://github.com/nicholastn1/cadence/releases/latest">download the app</a>.</p>
</main>
</body>
</html>
